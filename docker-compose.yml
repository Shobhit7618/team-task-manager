services:
  # 🧠 1. THE BACKEND API CONTAINER
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://shobhit:password@postgres_db:5432/taskmanager?schema=public
      # 🚀 THE FIX: Give this a solid, explicit fallback string right here
      - JWT_SECRET=my_super_secret_kanban_token_key_12345 
    command: node src/app.js
    depends_on:
      - postgres_db

  # 🎨 2. THE FRONTEND VITE WEB CONTAINER
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:5000/api
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - backend

  # 🗄️ 3. LOCAL POSTGRESQL DATABASE CONTAINER
  postgres_db:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=shobhit
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=taskmanager
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: